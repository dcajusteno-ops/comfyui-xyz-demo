<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c1917" />
    <title>ComfyUI XYZ 控制台</title>
    <script>
      (function() {
        try {
          var theme = JSON.parse(localStorage.getItem('xyz_theme'));
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- boot 门期间（拉取 /api/ui-state，本地通常 <50ms）的占位，render 后被整体替换 -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #888; background: var(--bg, #fafaf9);">
        加载中…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
